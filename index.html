            color: white;

            background:

        body::before {
            content: "";

            inset: 0;

            pointer-events: none;

            background:

                    circle,
                    transparent 25%,
                    rgba(0, 0, 0, 0.45) 100%
                );

            z-index: 0;
        }

        /* Основной блок */

        .container {

            align-items: center;

            box-shadow:

        }

        /* Заголовок */

        .title {
            font-size: clamp(65px, 10vw, 115px);

            font-weight: 700;

            letter-spacing: 8px;

            text-transform: uppercase;

            margin-bottom: 20px;

            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.8);
        }

        .description {

            color: #f2fff3;

        }

        .description span {
            color: #72ed82;
            font-weight: 700;
        }

        /* Социальные сети */

        .socials {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 25px;

            margin-top: 20px;
        }

        .social {
            width: 90px;
            height: 90px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            text-decoration: none;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .social:hover {
            transform: translateY(-8px) scale(1.08);
        }

        /* Telegram */

        .telegram {
            background: #229ED9;

            box-shadow:
                0 10px 30px rgba(34, 158, 217, 0.30);
        }

        .telegram:hover {
            box-shadow:
                0 15px 40px rgba(34, 158, 217, 0.55);
        }

        /* TikTok */

        .tiktok {
            background: #050505;

            border: 1px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.45);
        }

        .tiktok:hover {
            box-shadow:
                0 15px 40px rgba(255, 255, 255, 0.25);
        }

        .social svg {
            width: 50px;
            height: 50px;

            fill: white;
        }

        /* Подписи */

        .social-name {
            margin-top: 12px;

            font-size: 14px;

            color: rgba(255, 255, 255, 0.75);
        }

        /* Анимация */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Телефон */

        @media (max-width: 600px) {

            .container {
                padding: 20px 15px;
            }

            .content {
                padding: 40px 20px;
            }

            }

            }

                width: 82px;
                height: 82px;

                border-radius: 18px;
            }

            .social svg {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
