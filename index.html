<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jungle | MC-ZONE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family: "Montserrat", sans-serif;
    color: white;

    background:
        linear-gradient(
            rgba(0, 20, 10, 0.48),
            rgba(0, 10, 5, 0.82)
        ),
        url("https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=2000&q=90");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}


/* =========================
   ДЕРЕВЬЯ ПО БОКАМ
========================= */

.tree {
    position: fixed;

    top: -5%;
    bottom: -5%;

    width: 30vw;

    background-image:
        url("https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=1200&q=90");

    background-size: cover;

    filter: blur(7px);

    opacity: 0.55;

    pointer-events: none;

    z-index: 0;
}

.tree-left {
    left: -100px;
    background-position: left center;
}

.tree-right {
    right: -100px;
    background-position: right center;
}


/* =========================
   СНЕЖИНКИ
========================= */

.snow {
    position: fixed;

    pointer-events: none;

    z-index: 2;

    color: white;

    text-shadow:
        0 0 8px rgba(255,255,255,0.8);

    animation: floatSnow 5s ease-in-out infinite;
}

.snow1 {
    left: 20%;
    top: 28%;
    font-size: 28px;
}

.snow2 {
    right: 19%;
    top: 39%;
    font-size: 30px;
}

.snow3 {
    left: 47%;
    top: 17%;
    font-size: 24px;
}

.snow4 {
    right: 37%;
    top: 24%;
    font-size: 22px;
}

.snow5 {
    left: 29%;
    bottom: 25%;
    font-size: 34px;
}

.snow6 {
    right: 29%;
    bottom: 28%;
    font-size: 27px;
}


/* =========================
   ОСНОВНОЙ БЛОК
========================= */

.container {
    position: relative;

    z-index: 3;

    min-height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 40px 20px;
}

.content {
    width: min(850px, 100%);

    text-align: center;

    padding: 35px 25px;

    background: rgba(0, 15, 10, 0.18);

    backdrop-filter: blur(3px);

    animation: appear 1.2s ease;
}


/* =========================
   JUNGLE
========================= */

.title {
    position: relative;

    display: inline-block;

    font-size: clamp(65px, 10vw, 115px);

    font-weight: 700;

    font-style: italic;

    letter-spacing: 5px;

    color: #42f35c;

    margin-bottom: 20px;

    text-shadow:
        0 0 12px rgba(50,255,80,0.55),
        0 0 35px rgba(0,255,70,0.25),
        4px 6px 0 rgba(0,60,20,0.5);
}


/* линии возле заголовка */

.title::before,
.title::after {
    content: "━━━━━━";

    position: absolute;

    top: 50%;

    color: rgba(100,255,200,0.7);

    font-size: 12px;

    transform: translateY(-50%);
}

.title::before {
    right: 105%;
}

.title::after {
    left: 105%;
}


/* =========================
   ОПИСАНИЕ
========================= */

.description {
    max-width: 680px;

    margin: 0 auto 30px;

    font-family: "Caveat", cursive;

    font-size: clamp(25px, 3.5vw, 36px);

    line-height: 1.2;

    color: white;

    text-shadow:
        0 3px 10px rgba(0,0,0,0.9);
}

.description span {
    color: #25f58b;

    font-weight: 700;
}

.description .blue {
    color: #16e5f5;
}


/* =========================
   КАРТОЧКА ИНФОРМАЦИИ
========================= */

.player-info {

    width: min(660px, 100%);

    margin: 25px auto 35px;

    padding: 20px 28px;

    border-radius: 20px;

    background:
        linear-gradient(
            rgba(0, 35, 25, 0.65),
            rgba(0, 15, 12, 0.72)
        );

    border: 2px solid rgba(55,255,160,0.55);

    box-shadow:
        0 0 15px rgba(0,255,130,0.18),
        0 0 45px rgba(0,255,100,0.15),
        inset 0 0 25px rgba(0,255,130,0.08);

    backdrop-filter: blur(10px);
}


/* заголовок карточки */

.player-title {

    margin-bottom: 15px;

    font-size: 23px;

    font-weight: 700;

    color: #46ff82;

    text-shadow:
        0 0 10px rgba(40,255,100,0.45);
}


/* строки */

.info-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    min-height: 58px;

    margin: 5px 0;

    padding: 0 20px;

    border-radius: 13px;

    background:
        rgba(0, 20, 18, 0.72);

    border: 1px solid rgba(0,255,180,0.12);

    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.35);
}


/* левая часть */

.info-label {

    font-size: 17px;

    color: rgba(255,255,255,0.78);
}


/* правая часть */

.info-value {

    font-family: "Caveat", cursive;

    font-size: 27px;

    font-weight: 700;

    font-style: italic;
}


/* ник */

.nickname {

    color: #22e7f5;

    text-shadow:
        0 0 8px rgba(20,230,255,0.35);
}


/* донат */

.donate {

    color: #22e7f5;

    text-shadow:
        0 0 8px rgba(20,230,255,0.35);
}


/* сервер */

.server {

    color: white;

    font-family: "Montserrat", sans-serif;

    font-size: 19px;

    font-style: italic;
}


/* =========================
   СОЦИАЛЬНЫЕ СЕТИ
========================= */

.socials {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: 70px;

    margin-top: 30px;
}


.social-box {
    text-align: center;
}


.social {

    width: 92px;
    height: 92px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 22px;

    text-decoration: none;

    transition: 0.3s;

    border: 2px solid rgba(255,255,255,0.3);
}


.social:hover {

    transform:
        translateY(-8px)
        scale(1.08);
}


/* Telegram */

.telegram {

    background: #159bd7;

    box-shadow:
        0 0 25px rgba(0,180,255,0.65);
}


/* TikTok */

.tiktok {

    background: #050505;

    box-shadow:
        0 0 25px rgba(0,230,255,0.35);
}


.social svg {

    width: 52px;
    height: 52px;

    fill: white;
}


.social-name {

    margin-top: 10px;

    font-size: 17px;

    font-weight: 700;

    font-style: italic;

    color: white;

    text-shadow:
        0 2px 6px black;
}


/* =========================
   АНИМАЦИЯ
========================= */

@keyframes appear {

    from {
        opacity: 0;

        transform:
            translateY(30px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes floatSnow {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(12px)
            rotate(15deg);
    }
}


/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 600px) {

    .content {
        padding: 30px 10px;
    }

    .title {
        font-size: 57px;
        letter-spacing: 3px;
    }

    .title::before,
    .title::after {
        display: none;
    }

    .description {
        font-size: 28px;
    }

    .player-info {
        padding: 17px 12px;
    }

    .player-title {
        font-size: 19px;
    }

    .info-row {
        padding: 0 13px;
        min-height: 54px;
    }

    .info-label {
        font-size: 14px;
    }

    .info-value {
        font-size: 23px;
    }

    .server {
        font-size: 15px;
    }

    .socials {
        gap: 35px;
    }

    .social {
        width: 78px;
        height: 78px;
    }

    .social svg {
        width: 43px;
        height: 43px;
    }

    .social-name {
        font-size: 14px;
    }

    .tree {
        width: 40vw;
        opacity: 0.35;
        filter: blur(9px);
    }
}

</style>
</head>


<body>

</body>
</html>
